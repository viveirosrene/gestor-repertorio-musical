<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestor Musical</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 340px; box-sizing: border-box; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background: #2980b9; color: white; border: none; padding: 10px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2471a3; }
        .msg { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #2980b9; text-decoration: none; }
    </style>
    <script>
        function toggleChair() {
            var role = document.getElementById("roleSelect").value;
            var chairDiv = document.getElementById("chairDiv");
            if (role === "alumno") {
                chairDiv.style.display = "block";
            } else {
                chairDiv.style.display = "none";
            }
        }
    </script>
</head>
<body>
<div class="card">
    <h2>Crear Cuenta</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="msg">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
        <label>Usuario:</label>
        <input type="text" name="username" required>
        
        <label>Contraseña:</label>
        <input type="password" name="password" required>
        
        <label>Rol:</label>
        <select name="role" id="roleSelect" onchange="toggleChair()" required>
            <option value="alumno">Alumno</option>
            <option value="profesor">Profesor</option>
        </select>
        
        <div id="chairDiv">
            <label>Cátedra / Instrumento:</label>
            <input type="text" name="chair" placeholder="Ej. Piano, Bajo eléctrico...">
        </div>
        
        <button type="submit">Registrarse</button>
    </form>
    <div class="link">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
    </div>
</div>
</body>
</html>
